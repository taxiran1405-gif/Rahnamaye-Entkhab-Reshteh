name: Source Sentinel

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check watched sources
        run: python scripts/source_sentinel.py config/source-watchlist.json state/source-state.json | tee source-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: source-sentinel-report
          path: source-report.json
      - name: Commit updated state
        run: |
          git config user.name "source-sentinel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/source-state.json
          git diff --cached --quiet || git commit -m "chore: update source sentinel state"
          git push
