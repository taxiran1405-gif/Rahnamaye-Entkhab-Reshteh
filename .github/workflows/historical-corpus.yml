name: Historical mathematics corpus

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML pdfplumber
      - run: python scripts/fetch_and_extract_booklets.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-math-booklets
          path: artifacts/historical_booklets
          retention-days: 30
