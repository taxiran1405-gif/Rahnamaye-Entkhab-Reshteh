name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate seed data
        run: python scripts/validate_seed.py
      - name: Run backtest coverage audit
        run: python scripts/backtest_admission.py
      - name: Validate outcome template
        run: python scripts/validate_outcomes.py --input data/outcomes/outcome-template.jsonl
        continue-on-error: true
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
